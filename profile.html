<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#242326">
<title>Student Profile | Marikina University College</title>
<link rel="icon" type="image/png" href="assets/Mainlogotransp.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#242326;--burgundy:#6d1d28;--bronze:#c79b62;--cream:#e9e7e4;--muted:#6d6a68;--line:#d0cbc5;--white:#fff;--green:#28704a}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#e9e7e4,#d8d4d0);font-family:'DM Sans',sans-serif}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px clamp(20px,5vw,70px);color:var(--white);background:var(--ink)}.brand{display:flex;align-items:center;gap:12px;font:700 .92rem 'Space Grotesk',sans-serif;line-height:1.2}.brand img{width:44px;height:44px;object-fit:contain}.brand small{color:#d8b985;font:600 .72rem 'DM Sans',sans-serif}.back{color:var(--white);font-size:.8rem;font-weight:700;text-decoration:none}.back:hover{color:var(--bronze)}main{max-width:980px;margin:auto;padding:40px clamp(18px,5vw,70px) 70px}.eyebrow{margin:0 0 10px;color:var(--burgundy);font-size:.74rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font:700 clamp(2rem,4vw,3.2rem)/1 'Space Grotesk',sans-serif;letter-spacing:-.055em}header p:not(.eyebrow){margin:10px 0 28px;color:var(--muted)}.profile-layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.profile-card,.form-card{border:1px solid var(--line);border-radius:12px;padding:22px;background:rgba(255,255,255,.78);box-shadow:0 12px 28px rgba(36,35,38,.08)}.profile-card{text-align:center}.avatar{display:grid;place-items:center;width:110px;height:110px;margin:4px auto 16px;border:5px solid var(--bronze);border-radius:50%;color:var(--white);background:var(--ink);font:700 2.4rem 'Space Grotesk',sans-serif}.profile-card h2{margin:0;font:700 1.2rem 'Space Grotesk',sans-serif}.profile-card p{margin:7px 0;color:var(--muted);font-size:.8rem}.status{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:99px;color:var(--green);background:#e1f1e7;font-size:.7rem;font-weight:800}.section-title{margin:0 0 18px;font:700 1.25rem 'Space Grotesk',sans-serif}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:.78rem;font-weight:700}input,select{height:45px;width:100%;border:1px solid var(--line);border-radius:7px;padding:0 12px;color:var(--ink);background:var(--white);outline:none;font:inherit;font-size:.84rem}input:focus,select:focus{border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(109,29,40,.12)}.divider{grid-column:1/-1;margin:3px 0 -2px;padding-top:8px;border-top:1px solid var(--line);color:var(--burgundy);font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:24px}.button{border:1px solid var(--line);border-radius:7px;padding:11px 15px;color:var(--ink);background:var(--white);cursor:pointer;font:700 .8rem 'DM Sans',sans-serif}.button.primary{border-color:var(--burgundy);color:var(--white);background:var(--burgundy)}.button:hover{border-color:var(--bronze)}.save-message{margin-right:auto;color:var(--green);font-size:.78rem;font-weight:700}@media(max-width:720px){.profile-layout{grid-template-columns:1fr}.profile-card{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:14px;text-align:left}.profile-card .avatar{grid-row:span 2;width:88px;height:88px;margin:0}.profile-card .status{width:max-content}.form-grid{grid-template-columns:1fr}.field.full,.divider{grid-column:auto}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="assets/Mainlogotransp.png" alt=""><span>Marikina University College<br><small>Student Profile</small></span></div><a class="back" href="dashboard.html">← Back to dashboard</a></header>
<main><header><p class="eyebrow">Account settings</p><h1>Student profile</h1><p>Keep your personal and academic information up to date.</p></header><div class="profile-layout"><aside class="profile-card"><div class="avatar" id="avatar">S</div><div><h2 id="profileName">Student account</h2><p id="profileProgram">Student profile</p><span class="status">Active account</span></div></aside><section class="form-card"><h2 class="section-title">Profile information</h2><form id="profileForm"><div class="form-grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" required autocomplete="name" placeholder="Your full name"></div><div class="field"><label for="studentId">Student ID</label><input id="studentId" required placeholder="2025-0001"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" placeholder="09XX XXX XXXX"></div><div class="field"><label for="program">Program / course</label><input id="program" placeholder="Bachelor of Science in Business Administration"></div><div class="field"><label for="yearLevel">Year level</label><select id="yearLevel"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="divider">Emergency contact</div><div class="field"><label for="guardian">Parent / guardian name</label><input id="guardian" placeholder="Full name"></div><div class="field"><label for="guardianPhone">Parent / guardian phone</label><input id="guardianPhone" type="tel" placeholder="09XX XXX XXXX"></div><div class="field full"><label for="address">Home address</label><input id="address" placeholder="Complete address"></div></div><div class="actions"><span class="save-message" id="saveMessage" role="status" aria-live="polite"></span><button class="button" type="button" id="cancel">Cancel</button><button class="button primary" type="submit">Save profile</button></div></form></section></div></main>
<script>
const fields=['fullName','studentId','email','phone','program','yearLevel','guardian','guardianPhone','address'];const form=document.getElementById('profileForm');const saved=JSON.parse(localStorage.getItem('student-profile')||'{}');fields.forEach(id=>{const field=document.getElementById(id);if(saved[id])field.value=saved[id]});const name=document.getElementById('fullName').value||'Student account';document.getElementById('profileName').textContent=name;document.getElementById('profileProgram').textContent=document.getElementById('program').value||'Student profile';document.getElementById('avatar').textContent=name.trim().charAt(0).toUpperCase()||'S';function refreshIdentity(){const value=document.getElementById('fullName').value||'Student account';document.getElementById('profileName').textContent=value;document.getElementById('profileProgram').textContent=document.getElementById('program').value||'Student profile';document.getElementById('avatar').textContent=value.trim().charAt(0).toUpperCase()||'S'}document.getElementById('fullName').addEventListener('input',refreshIdentity);document.getElementById('program').addEventListener('input',refreshIdentity);form.addEventListener('submit',async event=>{event.preventDefault();const data={};fields.forEach(id=>data[id]=document.getElementById(id).value);localStorage.setItem('student-profile',JSON.stringify(data));const {data:sessionData}=await supabaseClient.auth.getSession();if(sessionData.session){const {error}=await supabaseClient.from('profiles').upsert({id:sessionData.session.user.id,full_name:data.fullName,student_id:data.studentId,program:data.program,year_level:data.yearLevel,phone:data.phone,guardian_name:data.guardian,guardian_phone:data.guardianPhone,address:data.address});if(error){document.getElementById('saveMessage').textContent=error.message;return}}refreshIdentity();document.getElementById('saveMessage').textContent='Profile saved successfully.'});document.getElementById('cancel').addEventListener('click',()=>{fields.forEach(id=>document.getElementById(id).value=saved[id]||'');refreshIdentity();document.getElementById('saveMessage').textContent='Changes canceled.'});
</script>
<script>
(async()=>{
	const {data:{session}}=await supabaseClient.auth.getSession();
	if(!session){window.location.href='index.html';return}
	const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
	const values=profile||{};
	document.getElementById('fullName').value=values.full_name||session.user.user_metadata?.full_name||'';
	document.getElementById('studentId').value=values.student_id||'';
	document.getElementById('email').value=session.user.email||'';
	document.getElementById('phone').value=values.phone||'';
	document.getElementById('program').value=values.program||'';
	document.getElementById('yearLevel').value=values.year_level||'1st Year';
	document.getElementById('guardian').value=values.guardian_name||'';
	document.getElementById('guardianPhone').value=values.guardian_phone||'';
	document.getElementById('address').value=values.address||'';
	localStorage.removeItem('student-profile');
	document.getElementById('fullName').dispatchEvent(new Event('input'));
	document.getElementById('program').dispatchEvent(new Event('input'));
})();
</script>
</body>
</html>
