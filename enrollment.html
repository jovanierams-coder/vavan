<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#242326">
<title>Enrollment Management | Marikina University College</title>
<link rel="icon" type="image/png" href="assets/Mainlogotransp.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#242326;--burgundy:#6d1d28;--bronze:#c79b62;--cream:#e9e7e4;--muted:#6d6a68;--line:#d0cbc5;--white:#fff;--green:#28704a}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px clamp(20px,5vw,70px);color:var(--white);background:var(--ink)}.brand{display:flex;align-items:center;gap:12px;font:700 .92rem 'Space Grotesk',sans-serif;line-height:1.2}.brand img{width:44px;height:44px;object-fit:contain}.brand small{color:#d8b985;font:600 .72rem 'DM Sans',sans-serif}.back{color:var(--white);font-size:.8rem;font-weight:700;text-decoration:none}.back:hover{color:var(--bronze)}main{max-width:1200px;margin:auto;padding:42px clamp(18px,5vw,70px) 70px}.heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow{margin:0 0 10px;color:var(--burgundy);font-size:.74rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font:700 clamp(2rem,4vw,3.3rem)/1 'Space Grotesk',sans-serif;letter-spacing:-.055em}.heading p{margin:10px 0 0;color:var(--muted)}.panel{border:1px solid var(--line);border-radius:11px;padding:20px;background:rgba(255,255,255,.76);box-shadow:0 8px 20px rgba(36,35,38,.06)}.controls{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) auto;gap:12px;align-items:end;margin-bottom:18px}.field{display:grid;gap:6px}.field label{color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 11px;color:var(--ink);background:var(--white)}.btn{border:1px solid var(--burgundy);border-radius:7px;padding:10px 14px;color:var(--white);background:var(--burgundy);cursor:pointer;font-size:.8rem;font-weight:800}.btn:disabled{opacity:.5;cursor:not-allowed}.status{min-height:20px;margin:0 0 12px;color:var(--green);font-size:.8rem;font-weight:700}.table-wrap{overflow:auto}.roster{width:100%;border-collapse:collapse;font-size:.86rem}.roster th{padding:10px 8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-align:left;text-transform:uppercase}.roster td{padding:14px 8px;border-bottom:1px solid var(--line)}.roster tr:last-child td{border-bottom:0}.status-btn{border:1px solid #b7d4c2;border-radius:99px;padding:5px 9px;color:var(--green);background:#edf7f0;cursor:pointer;font-size:.72rem;font-weight:800}.status-btn.dropped{border-color:#e0b9b9;color:#8c2525;background:#fff1f1}.remove{border:0;color:var(--burgundy);background:transparent;cursor:pointer;font-size:.78rem;font-weight:800}.empty{text-align:center;color:var(--muted)}@media(max-width:760px){.heading{display:block}.controls{grid-template-columns:1fr}.topbar{align-items:flex-start}}
.section-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px;padding-bottom:3px}.section-tab{flex:0 0 auto;border:1px solid var(--line);border-radius:7px;padding:9px 12px;color:var(--ink);background:var(--white);cursor:pointer;font-size:.78rem;font-weight:800}.section-tab:hover,.section-tab.active{border-color:var(--burgundy);color:var(--white);background:var(--burgundy)}.section-tab span{margin-left:4px;opacity:.72;font-size:.7rem}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="assets/Mainlogotransp.png" alt=""><span>Marikina University College<br><small>Enrollment Management</small></span></div><a class="back" href="gradebook.html">Back to gradebook</a></header>
<main><section class="heading"><div><p class="eyebrow">Teacher workspace</p><h1>Enrollment Management</h1><p>Add students to your assigned unit and manage their enrollment status.</p></div><span class="field"><label for="subjectSelect">Assigned unit</label><select id="subjectSelect" aria-label="Assigned unit"></select></span></section>
<div class="section-tabs" id="sectionTabs" role="tablist" aria-label="Student sections"><button class="section-tab active" type="button" data-section="4-1" role="tab">4-1 <span>0</span></button><button class="section-tab" type="button" data-section="4-2" role="tab">4-2 <span>0</span></button><button class="section-tab" type="button" data-section="4-3" role="tab">4-3 <span>0</span></button><button class="section-tab" type="button" data-section="4-4" role="tab">4-4 <span>0</span></button><button class="section-tab" type="button" data-section="4-5" role="tab">4-5 <span>0</span></button><button class="section-tab" type="button" data-section="4-6" role="tab">4-6 <span>0</span></button><button class="section-tab" type="button" data-section="4-7" role="tab">4-7 <span>0</span></button><button class="section-tab" type="button" data-section="4-8" role="tab">4-8 <span>0</span></button><button class="section-tab" type="button" data-section="4-9" role="tab">4-9 <span>0</span></button><button class="section-tab" type="button" data-section="4-10" role="tab">4-10 <span>0</span></button><button class="section-tab" type="button" data-section="4-11" role="tab">4-11 <span>0</span></button><button class="section-tab" type="button" data-section="4-12" role="tab">4-12 <span>0</span></button></div>
<section class="panel"><div class="controls"><div class="field"><label for="studentSelect">Student</label><select id="studentSelect" aria-label="Student"></select></div><button class="btn" id="addEnrollment" type="button">Add to unit</button></div><p class="status" id="status" role="status" aria-live="polite"></p><div class="table-wrap"><table class="roster"><thead><tr><th>Student name</th><th>Student ID</th><th>Section</th><th>Enrollment status</th><th></th></tr></thead><tbody id="enrollmentBody"><tr><td class="empty" colspan="5">Loading enrollments...</td></tr></tbody></table></div></section></main>
<script>
const subjectSelect=document.getElementById('subjectSelect');const studentSelect=document.getElementById('studentSelect');const addEnrollment=document.getElementById('addEnrollment');const enrollmentBody=document.getElementById('enrollmentBody');const statusMessage=document.getElementById('status');let subjects=[];let students=[];let currentSubject=null;let selectedSection='4-1';let currentEnrollments=[];
function setStatus(message,error=false){statusMessage.textContent=message;statusMessage.style.color=error?'var(--burgundy)':'var(--green)';}
function subjectOptions(){subjectSelect.innerHTML=subjects.map(subject=>`<option value="${subject.id}">${subject.code} - ${subject.name}</option>`).join('');}
async function loadStudents(){const {data,error}=await supabaseClient.from('profiles').select('id,full_name,student_id,section,role').eq('role','student').order('full_name');if(error){setStatus(error.message,true);return;}students=(data||[]).filter(student=>student.role==='student');}
async function loadEnrollments(){if(!currentSubject)return;const {data:enrollments,error}=await supabaseClient.from('enrollments').select('student_id,enrollment_status').eq('subject_id',currentSubject.id);if(error){setStatus(error.message,true);return;}const studentIds=new Set(students.map(student=>student.id));const enrolledIds=new Set((enrollments||[]).map(enrollment=>enrollment.student_id));studentSelect.innerHTML=students.filter(student=>!enrolledIds.has(student.id)).map(student=>`<option value="${student.id}">${student.full_name} - ${student.student_id||'No ID'}</option>`).join('');addEnrollment.disabled=studentSelect.options.length===0;enrollmentBody.innerHTML='';const studentById=new Map(students.map(student=>[student.id,student]));(enrollments||[]).filter(enrollment=>studentIds.has(enrollment.student_id)).forEach(enrollment=>{const student=studentById.get(enrollment.student_id);if(!student)return;const row=document.createElement('tr');const dropped=enrollment.enrollment_status==='dropped_out';row.innerHTML=`<td>${student.full_name}</td><td>${student.student_id||'-'}</td><td>${student.section||'-'}</td><td><button class="status-btn${dropped?' dropped':''}" type="button">${dropped?'Dropped out':'Active'}</button></td><td><button class="remove" type="button">Remove</button></td>`;row.querySelector('.status-btn').onclick=async()=>{const nextStatus=dropped?'active':'dropped_out';const {error:updateError}=await supabaseClient.from('enrollments').update({enrollment_status:nextStatus}).eq('student_id',student.id).eq('subject_id',currentSubject.id);if(updateError){setStatus(updateError.message,true);return;}setStatus(`${student.full_name} status updated.`);loadEnrollments();};row.querySelector('.remove').onclick=async()=>{const {error:removeError}=await supabaseClient.from('enrollments').delete().eq('student_id',student.id).eq('subject_id',currentSubject.id);if(removeError){setStatus(removeError.message,true);return;}setStatus(`${student.full_name} removed from the unit.`);loadEnrollments();};enrollmentBody.appendChild(row);});if(!enrollmentBody.children.length)enrollmentBody.innerHTML='<tr><td class="empty" colspan="5">No students enrolled in this unit.</td></tr>';}
function renderSection(){const studentById=new Map(students.map(student=>[student.id,student]));const enrolledIds=new Set(currentEnrollments.map(enrollment=>enrollment.student_id));const available=students.filter(student=>student.section===selectedSection&&!enrolledIds.has(student.id));studentSelect.innerHTML=available.map(student=>`<option value="${student.id}">${student.full_name} - ${student.student_id||'No ID'}</option>`).join('');addEnrollment.disabled=available.length===0;enrollmentBody.innerHTML='';currentEnrollments.filter(enrollment=>studentById.get(enrollment.student_id)?.section===selectedSection).forEach(enrollment=>{const student=studentById.get(enrollment.student_id);const row=document.createElement('tr');const dropped=enrollment.enrollment_status==='dropped_out';row.innerHTML=`<td>${student.full_name}</td><td>${student.student_id||'-'}</td><td>${student.section||'-'}</td><td><button class="status-btn${dropped?' dropped':''}" type="button">${dropped?'Dropped out':'Active'}</button></td><td><button class="remove" type="button">Remove</button></td>`;row.querySelector('.status-btn').onclick=async()=>{const nextStatus=dropped?'active':'dropped_out';const {error}=await supabaseClient.from('enrollments').update({enrollment_status:nextStatus}).eq('student_id',student.id).eq('subject_id',currentSubject.id);if(error){setStatus(error.message,true);return;}setStatus(`${student.full_name} status updated.`);loadEnrollments();};row.querySelector('.remove').onclick=async()=>{const {error}=await supabaseClient.from('enrollments').delete().eq('student_id',student.id).eq('subject_id',currentSubject.id);if(error){setStatus(error.message,true);return;}setStatus(`${student.full_name} removed from the unit.`);loadEnrollments();};enrollmentBody.appendChild(row);});if(!enrollmentBody.children.length)enrollmentBody.innerHTML='<tr><td class="empty" colspan="5">No students in this section for this unit.</td></tr>';document.querySelectorAll('.section-tab').forEach(tab=>{tab.classList.toggle('active',tab.dataset.section===selectedSection);tab.querySelector('span').textContent=students.filter(student=>student.section===tab.dataset.section).length;});}
loadEnrollments=async()=>{if(!currentSubject)return;const {data,error}=await supabaseClient.from('enrollments').select('student_id,enrollment_status').eq('subject_id',currentSubject.id);if(error){setStatus(error.message,true);return;}currentEnrollments=data||[];renderSection();};
document.querySelectorAll('.section-tab').forEach(tab=>tab.onclick=()=>{selectedSection=tab.dataset.section;renderSection();});
addEnrollment.onclick=async()=>{if(!currentSubject||!studentSelect.value)return;const {error}=await supabaseClient.from('enrollments').insert({student_id:studentSelect.value,subject_id:currentSubject.id,enrollment_status:'active'});if(error){setStatus(error.message,true);return;}setStatus('Student added to the unit.');loadEnrollments();};subjectSelect.onchange=()=>{currentSubject=subjects.find(subject=>String(subject.id)===subjectSelect.value);loadEnrollments();};
(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){window.location.href='index.html';return;}const {data:profile}=await supabaseClient.from('profiles').select('full_name,role').eq('id',session.user.id).maybeSingle();if(profile?.role!=='teacher'){window.location.href='dashboard.html';return;}const {data,error}=await supabaseClient.from('subjects').select('id,code,name,term').eq('teacher_id',session.user.id).order('id');if(error||!data?.length){setStatus('No assigned units found.',true);addEnrollment.disabled=true;return;}subjects=data;subjectOptions();currentSubject=subjects[0];await loadStudents();const firstSection=students.map(student=>student.section).find(Boolean);if(firstSection)selectedSection=firstSection;loadEnrollments();})();
</script>
</body>
</html>
